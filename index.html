
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vijay AI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <div class="top-icons">
    <button>☰</button>
    <button id="voiceBtn">🎤</button>
  </div>

  <div class="hero">

    <div class="orb"></div>

    <h1>Hi, Vijay AI</h1>

    <p>
      Smart AI assistant with real-time responses,
      voice, image and file support.
    </p>

  </div>

  <div class="cards">

    <div class="card">
      <span>🖼</span>
      <h3>Generate Image</h3>
      <p>Create AI images instantly</p>
    </div>

    <div class="card">
      <span>🎥</span>
      <h3>Create Video</h3>
      <p>AI video generation</p>
    </div>

    <div class="card">
      <span>📝</span>
      <h3>Summarise Text</h3>
      <p>Convert long text short</p>
    </div>

    <div class="card">
      <span>📄</span>
      <h3>CV Builder</h3>
      <p>Create professional CV</p>
    </div>

  </div>

  <div class="chat-box" id="chatBox"></div>

  <div class="bottom-bar">

    <label class="icon-btn">
      📎
      <input type="file" hidden>
    </label>

    <input
      type="text"
      id="userInput"
      placeholder="Type Message"
    >

    <button class="send-btn" onclick="sendMessage()">
      ➤
    </button>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
